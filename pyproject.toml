[project]
name = "shared-agent-workspace"
version = "0.1.0"
description = "Phase 0 shared-agent workspace MCP server"
requires-python = ">=3.11"
dependencies = [
  "daytona>=0.40.0",
  "fastapi>=0.115.0",
  "fastmcp>=2.0.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27.0", "pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

